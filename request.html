<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request a site — HoldFast</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="logo" href="index.html">HoldFast</a>
    <nav class="site-nav"><a href="index.html">Home</a><a href="contact.html" class="btn btn-primary nav-cta">Contact</a></nav>
  </div></header>
  <main id="main">
    <header class="page-intro"><div class="wrap">
      <p class="eyebrow">Design · Build</p>
      <h1>Tell us about the site you need.</h1>
    </div></header>
    <section class="section"><div class="wrap" style="max-width:40rem;">
      <form class="form" action="#" method="post">
        <div class="field"><label for="full-name">Full name</label><input id="full-name" name="full_name" type="text" required></div>
        <div class="field"><label for="site-type">Type of website</label><input id="site-type" name="site_type" type="text" required></div>
        <fieldset class="field">
          <legend>Do we need a domain?</legend>
          <div class="choice-row">
            <label class="choice"><input type="radio" name="need_domain" value="yes" required> Yes</label>
            <label class="choice"><input type="radio" name="need_domain" value="no"> No</label>
          </div>
        </fieldset>
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required></div>
        <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required></div>
        <button class="btn btn-primary" type="submit">Submit request</button>
      </form>
    </div></section>
  </main>
</body>
</html>
