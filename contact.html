<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Northline Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div class="wrap header-inner">
    <a class="logo" href="index.html">Northline <span>Studio</span></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label class="nav-toggle-label" for="nav-toggle" aria-label="Open menu"><span></span></label>
    <nav class="site-nav">
      <a href="index.html">Home</a><a href="about.html">About Us</a><a href="work.html">Work</a>
      <a href="services.html">Services</a><a href="careers.html">Careers</a>
      <a href="contact.html" class="btn btn-primary nav-cta" aria-current="page">Contact</a>
    </nav>
  </div></header>
  <main id="main">
    <header class="page-intro"><div class="wrap"><p class="eyebrow">Contact</p><h1>Request a consultation.</h1><p class="lead">Reply within two working days.</p></div></header>
    <section class="section"><div class="wrap contact-layout">
      <form class="form" action="#" method="post">
        <div class="form-row">
          <div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" required></div>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required></div>
        </div>
        <div class="field"><label for="need">What do you need?</label>
          <select id="need" name="need"><option>New website or rebuild</option><option>Maintenance plan</option><option>Design and care</option><option>Domain help</option></select></div>
        <div class="field"><label for="message">Project description</label><textarea id="message" name="message" required></textarea></div>
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
      <aside class="contact-aside">
        <div><h2>Studio</h2><p>412 SE Division St<br>Portland, OR 97202</p>
        <p><a href="mailto:hello@northline.studio">hello@northline.studio</a><br>+1 (503) 555-0114</p></div>
      </aside>
    </div></section>
  </main>
</body></html>
